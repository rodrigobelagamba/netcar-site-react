name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - name: Validate stock search refresh
        run: npm run stock:test-search
      - name: Validate homepage PHP
        run: |
          php -l public/index.php
          php -l public/home-hero.php
          node --test scripts/tests/home-hero-selection.test.mjs
      - name: Validate tablet catalog filters and routing
        run: |
          npx tsx --test scripts/tests/tablet-stock.test.ts
          node --test scripts/tests/tablet-routing.test.mjs
      - name: Validate circular portraits and store photos
        run: |
          node --test scripts/tests/circular-portraits.test.mjs
          npx tsx --test scripts/tests/store-gallery.test.tsx
          php -l public/img.php
          php scripts/tests/image-orientation.test.php
      - name: Validate deployment connection policy
        run: node --test scripts/tests/deploy-network.test.mjs
      - name: Validate vehicle image quarantine and recovery
        run: |
          php -l public/vehicle-images.php
          node --test scripts/tests/vehicle-image-policy.test.mjs
      - name: Validate vehicle equipment provenance and ranking
        run: |
          php -l public/vehicle-equipment.php
          php -l public/detalhe-veiculo.php
          npm run stock:test-equipment
      - name: Validate model year presentation
        run: node --test scripts/tests/vehicle-model-year.test.mjs
      - name: Validate daily equipment audit
        run: npm run stock:test-equipment-audit
      - name: Validate DevOps scheduler and equipment management
        run: |
          npm --prefix devops ci
          npm --prefix devops test
          node --test devops/client/src/equipment.test.js
          npm --prefix devops run build
      - name: Validate compact vehicle contact bar
        run: npx tsx --test scripts/tests/vehicle-whatsapp-card.test.tsx
      - name: Validate compact home contact bar
        run: npx tsx --test scripts/tests/home-whatsapp-bar.test.tsx
      - name: Validate vehicle description preview
        run: npx tsx --test scripts/tests/vehicle-description.test.tsx
      - name: Validate comparison photos and layout
        run: npx tsx --test scripts/tests/comparison-vehicle-image.test.tsx scripts/tests/vehicle-comparison-table.test.tsx scripts/tests/comparison-pages.test.tsx src/lib/comparisonContact.test.ts
      - name: Validate delivery gallery and deployment preservation
        run: |
          node --test scripts/tests/entregas-deploy.test.mjs
          npx tsx --test src/modules/entregas/lib/deliveries.test.ts src/modules/entregas/components/viewerFocus.test.ts
      - name: Validate i-CHECK metadata and reports
        run: npm run icheck:validate
      - run: npm run build
      - name: Validate generated comparison SEO and routing
        env:
          NETCAR_VERIFY_GENERATED_SEO: "1"
        run: node --test scripts/tests/comparison-seo.test.mjs scripts/tests/comparison-routing.test.mjs
      - name: Validate vehicle video synchronization
        run: |
          find docs/social -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          php docs/social/tests/VehicleVideoSyncTest.php
          php docs/social/tests/InstagramGbpSyncTest.php
          php docs/social/tests/InstagramGbpHardeningTest.php
