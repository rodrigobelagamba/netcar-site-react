name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - name: Validate stock search refresh
        run: npm run stock:test-search
      - name: Validate compact vehicle contact bar
        run: npx tsx --test scripts/tests/vehicle-whatsapp-card.test.tsx
      - name: Validate vehicle description preview
        run: npx tsx --test scripts/tests/vehicle-description.test.tsx
      - name: Validate comparison photos and layout
        run: npx tsx --test scripts/tests/comparison-vehicle-image.test.tsx scripts/tests/vehicle-comparison-table.test.tsx scripts/tests/comparison-pages.test.tsx src/lib/comparisonContact.test.ts
      - name: Validate delivery gallery and deployment preservation
        run: |
          node --test scripts/tests/entregas-deploy.test.mjs
          npx tsx --test src/modules/entregas/lib/deliveries.test.ts src/modules/entregas/components/viewerFocus.test.ts
      - name: Validate i-CHECK metadata and reports
        run: npm run icheck:validate
      - run: npm run build
      - name: Validate generated comparison SEO and routing
        env:
          NETCAR_VERIFY_GENERATED_SEO: "1"
        run: node --test scripts/tests/comparison-seo.test.mjs scripts/tests/comparison-routing.test.mjs
      - name: Validate vehicle video synchronization
        run: |
          find docs/social -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          php docs/social/tests/VehicleVideoSyncTest.php
          php docs/social/tests/InstagramGbpSyncTest.php
          php docs/social/tests/InstagramGbpHardeningTest.php
