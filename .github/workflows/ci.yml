name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Validate vehicle video synchronization
        run: |
          find docs/social -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          php docs/social/tests/VehicleVideoSyncTest.php
          php docs/social/tests/InstagramGbpSyncTest.php
          php docs/social/tests/InstagramGbpHardeningTest.php
